        # ---------------------------------------------------------
        # 노트 동기화 서버 (https://<도메인>/notes-api/)
        # compose: 500gssd(1)/notes-api/notes-api.yml
        # ---------------------------------------------------------
        location = /notes-api {
            return 301 /notes-api/;
        }
        location /notes-api/ {
            # 앱 컨테이너가 꺼져 있어도 nginx 가 뜨도록 런타임에 이름 해석
            resolver 127.0.0.11 valid=30s;
            set $notes_api http://notes-api:8000;
            rewrite ^/notes-api/(.*)$ /$1 break;
            proxy_pass $notes_api;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 사진·영상 첨부 업로드
            client_max_body_size 10G;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            add_header X-Backend "notes-api" always;
        }
